version: '3.8'

services:
  opencode:
    build: .
    image: opencode-webui-workspace:latest
    container_name: opencode-webui
    ports:
      - "4096:4096"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun
    environment:
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:-opencode}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-change-me}
      TAILSCALE_AUTH_KEY: ${TAILSCALE_AUTH_KEY:-}
    command: ["web", "--port", "4096", "--hostname", "0.0.0.0"]
    volumes:
      - ./data:/data
    restart: unless-stopped
    networks:
      - opencode-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4096"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  opencode-network:
    driver: bridge
